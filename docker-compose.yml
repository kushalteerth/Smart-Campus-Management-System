version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartcampus}
      POSTGRES_USER: ${POSTGRES_USER:-campus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campus_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./smart-campus-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smartcampus}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-campus_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-campus_pass}
      JWT_SECRET: ${JWT_SECRET:-8a3c2b9f6d4e1a7c5b3d9f2e8a1c4b7d6f5a3c2b1e9d4f8a7c5b3d9f2e8a1c4}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./smart-campus-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:

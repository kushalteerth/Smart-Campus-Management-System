spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartcampus}
    username: ${SPRING_DATASOURCE_USERNAME:campus_user}
    password: ${SPRING_DATASOURCE_PASSWORD:campus_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    
server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:8a3c2b9f6d4e1a7c5b3d9f2e8a1c4b7d6f5a3c2b1e9d4f8a7c5b3d9f2e8a1c4}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

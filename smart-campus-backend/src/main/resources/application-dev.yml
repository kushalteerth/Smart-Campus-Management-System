spring:
  datasource:
    url: jdbc:h2:mem:smartcampusdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=YEAR
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false

server:
  port: 8080

jwt:
  secret: 8a3c2b9f6d4e1a7c5b3d9f2e8a1c4b7d6f5a3c2b1e9d4f8a7c5b3d9f2e8a1c4
  expiration: 86400000
  refresh-expiration: 604800000
